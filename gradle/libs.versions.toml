[versions]
kotlin = "2.4.20"
compose = "1.13.0-alpha01"
material3 = "1.5.0-alpha29"
activity = "1.13.0"
lifecycle = "2.10.0"
savedstate = "1.4.0"
navigation3 = "1.1.7"

agp = "9.3.3"
annotation = "1.11.0"
protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
xposed-api = "102.0.0"
xposed-service = "102.0.0"

[libraries]
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-icons-cmp = { module = "com.composables:icons-material-symbols-rounded-filled-cmp-jvm", version = "2.2.1" }
compose-icons = { module = "com.composables:icons-material-symbols-rounded-filled-android", version = "2.2.1" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
savedstate = { module = "androidx.savedstate:savedstate", version.ref = "savedstate" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
junit = { module = "junit:junit", version = "4.13.2" }

androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }
protobuf-java = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "xposed-api" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "xposed-service" }

[plugins]
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
